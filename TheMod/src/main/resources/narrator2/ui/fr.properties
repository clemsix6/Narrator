# Texts players read that do not come from Claude, in French (UTF-8). Keys and placeholders: UiTexts.KEYS.
# Override them key by key in config/narrator2/ui/fr.properties.

narrator.name=Narrateur
narrator.prefix=[Narrateur]
narrator.whisper_prefix=[Narrateur → toi]
narrator.color=gold
narrator.thinking=Le Narrateur réfléchit…

pray.sent=Ta prière s'élève vers le Narrateur. Il l'a entendue ; reste à savoir s'il daignera répondre.
pray.cooldown=Le ciel reçoit déjà ta dernière prière. Tu pourras prier de nouveau dans {seconds} s.

items.returned=Le Narrateur te rend ce qu'il t'avait confisqué : {items}.
items.no_room=Ton inventaire est plein : le Narrateur garde encore {items}. Fais de la place et il te le rendra.
items.recovered=La créature du Narrateur s'est évanouie ; il te rend ce que tu lui avais confié : {items}.
items.delivered=Le Narrateur te remet enfin ce qu'il te devait : {items}.

book.author=Le Narrateur

# Mécaniques : défis, duels, paris, offrandes, jokers.
mechanics.unavailable=Les défis, duels, paris et offrandes du Narrateur sont suspendus pour l'instant.
command.unknown_challenge=Aucun défi en cours ne porte la référence {id}.

challenge.bar={title} · {progress} · {time}
challenge.progress.count={have}/{need}
challenge.progress.done=réussi
challenge.progress.out=éliminé
challenge.progress.alive=en lice
challenge.progress.waiting=à toi de jouer
challenge.judging=le Narrateur juge
duel.bar={title} · {time}

duel.invite=Le Narrateur te propose un duel contre {opponent} : « {title} », {where}. Tu as {seconds} s pour répondre ; personne n'y meurt.
duel.where.arena=dans une arène en {x} {y} {z}
duel.where.here=là où vous êtes
duel.accept_button=[accepter]
duel.decline_button=[refuser]
duel.accepted={player} accepte le duel.
duel.declined={player} refuse le duel : il n'aura pas lieu.
duel.start=En garde contre {opponent} !
duel.won=Tu remportes le duel.
duel.lost=Tu perds le duel. Ton orgueil ne s'en relèvera pas ; toi, si.
duel.draw=Match nul : personne ne l'emporte.
duel.expired=L'invitation au duel a expiré.
duel.cancelled=Le duel est annulé.
duel.not_invited=Tu n'es pas invité à ce duel, ou il a déjà commencé.

bet.placed=Tu paries {items} sur {on} ({id}). Le Narrateur garde ta mise jusqu'au verdict.
bet.on_nobody=personne
bet.closed=Les paris sont fermés pour ce défi.
bet.no_item=Tiens en main ce que tu veux miser (un joker ne se mise pas).
bet.already=Tu as déjà parié sur ce défi.
bet.unknown_option=Parie sur l'un de ces choix : {options}.
bet.won=Pari gagné ! Tu reçois {items}.
bet.lost=Pari perdu : ta mise, {items}, part chez le gagnant.
bet.returned=Ta mise te revient : {items}.

offer.sent=Tu déposes {items} en offrande. Le Narrateur décidera s'il daigne la prendre.
offer.accepted=Le Narrateur accepte ton offrande : {items}, désormais à lui.
offer.returned=Le Narrateur n'a pas voulu de ton offrande ; il te rend {items}.
offer.no_item=Tiens en main ce que tu veux offrir au Narrateur (un joker ne s'offre pas).
offer.pending=Ta précédente offrande attend encore la réponse du Narrateur.
offer.too_soon=Le Narrateur ne reçoit pas d'offrande à tout bout de champ : réessaie dans {time}.

joker.name=Joker du Narrateur
joker.lore=Clic droit dans le vide : lève un châtiment du Narrateur.
joker.given=Le Narrateur t'accorde un joker : joue-le d'un clic droit dans le vide pour lever un de ses châtiments.
joker.played=Tu joues ton joker : le Narrateur lève son châtiment, de mauvaise grâce.
joker.nothing=Le Narrateur ne t'inflige rien en ce moment : garde ton joker.
